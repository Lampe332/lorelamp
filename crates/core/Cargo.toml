[package]
name = "rp-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
regex = "1"
# gzip (Perchance exports), CRC-32 and zlib for the PNG writer; already in the tree via other crates.
flate2 = "1"
# CHARX and Backyard .byaf are zip archives; deflate only, no encryption or other codecs.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# YAML cards: maintained pure-Rust parser (serde_yaml is archived), exposes events so aliases can be refused.
yaml-rust2 = { version = "0.11", default-features = false }
