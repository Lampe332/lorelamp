[workspace]
resolver = "2"
members = ["crates/core", "crates/hw", "crates/models", "crates/server", "apps/desktop/src-tauri", "apps/mobile/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind": a panic in one server task must not end the whole app.

# Image decoding/encoding is ~10x slower unoptimised; debug servers and tests import many cards.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
