<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RP-App – Prototyp</title>
<meta name="description" content="Klickbarer UI-Prototyp der RP-App (Phase 0, Paket 0.5). Statisch, ohne Netzwerk.">
<link rel="stylesheet" href="styles.css">
<script>
  try { const t = localStorage.getItem('rp-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

</head>
<body>

    <symbol id="i-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>

    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M5 15.5V6.5a2 2 0 0 1 2-2h8.5"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M19.5 4v4.5H15"/></symbol>
    <symbol id="i-continue" viewBox="0 0 24 24"><path d="M4 12h11M11 7l5 5-5 5M20 6v12"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="8" r="2"/><path d="M7 7.5v9M17 10c0 4-4.5 4.5-9 7"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4.5 4.5l15 15"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.01"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-mask" viewBox="0 0 24 24"><path d="M5 5c4.5 1.6 9.5 1.6 14 0v6.5c0 4.8-3.3 8-7 8s-7-3.2-7-8z"/><path d="M8.3 10.6c.7-.6 1.6-.6 2.3 0M13.4 10.6c.7-.6 1.6-.6 2.3 0M9.2 14.6c1.7 1.3 3.9 1.3 5.6 0"/></symbol>
    <symbol id="i-clapper" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M4.3 10L3.8 6.6 18.6 4.5l.5 3.4zM8.3 5.9l2.2 3.3M13.2 5.2l2.2 3.3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>

    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.5M7 9.5l5-5 5 5M5 19.5h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5v11M7 10.5l5 5 5-5M5 19.5h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17v.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-scene" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15M16.8 8.5h1.4M16.8 11.5h1.4"/></symbol>

    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16L12 20.5l8.5-4.5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="var(--text)"/><path d="M8 18.5V7.5h5.2a3.4 3.4 0 0 1 0 6.8H8M13 14.3l4.8 4.2" fill="none" stroke="var(--ground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>RP-App</b><small>0.1 Prototyp</small>
    </div>
    <nav class="nav" id="nav">
      <a href="#/chats" data-sec="chats"><svg class="ic"><use href="#i-chats"/></svg>Chats<span class="count num">7</span></a>
      <a href="#/charaktere" data-sec="charaktere"><svg class="ic"><use href="#i-chars"/></svg>Charaktere<span class="count num">8</span></a>
      <a href="#/entdecken/modelle" data-sec="entdecken"><svg class="ic"><use href="#i-discover"/></svg>Entdecken</a>
      <a href="#/einstellungen/allgemein" data-sec="einstellungen"><svg class="ic"><use href="#i-settings"/></svg>Einstellungen</a>
    </nav>
    <div class="side-group">
      <h2>Zuletzt</h2>
      <div class="recent" id="recent"></div>
    </div>
    <div class="side-foot">
      <div class="vram-mini">
        <div style="display:flex;justify-content:space-between"><span>Grafikspeicher</span><span class="num">21,4 / 24 GB</span></div>
        <div class="bar"><i style="width:89%"></i></div>
      </div>
      <div class="persona-row" id="personaRow"></div>
    </div>
  </aside>

  <header class="top">
    <svg class="brand-mark top-mark" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="var(--text)"/><path d="M8 18.5V7.5h5.2a3.4 3.4 0 0 1 0 6.8H8M13 14.3l4.8 4.2" fill="none" stroke="var(--ground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <button class="status-pill" data-act="inspector" title="Live-Status – öffnet den Prompt-Inspektor">
      <span class="dot" aria-hidden="true"></span>
      <b>Orion 26B</b><span class="sep">·</span><span class="num">104 tok/s</span><span class="sep hide-sm">·</span><span class="num hide-sm">34k/128k</span><span class="sep">·</span><span class="num">Cache 97 %</span>
    </button>
    <button class="cmd-trigger" data-act="cmdk" aria-label="Befehlsleiste öffnen">
      <svg class="ic sm"><use href="#i-search"/></svg><span>Suchen oder Befehl …</span><kbd>Strg K</kbd>
    </button>
    <button class="icon-btn" data-act="theme" id="themeBtn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel"><svg class="ic"><use href="#i-sun"/></svg></button>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation">
    <a href="#/chats" data-sec="chats"><svg class="ic lg"><use href="#i-chats"/></svg>Chats</a>
    <a href="#/charaktere" data-sec="charaktere"><svg class="ic lg"><use href="#i-chars"/></svg>Charaktere</a>
    <a href="#/entdecken/modelle" data-sec="entdecken"><svg class="ic lg"><use href="#i-discover"/></svg>Entdecken</a>
    <a href="#/einstellungen/allgemein" data-sec="einstellungen"><svg class="ic lg"><use href="#i-settings"/></svg>Einstellungen</a>
  </nav>
</div>

<div class="backdrop" id="backdrop" data-act="closeAll"></div>

<aside class="drawer" id="inspector" aria-label="Prompt-Inspektor" aria-hidden="true"></aside>

<div class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="Befehlsleiste">
  <div class="cmdk-in">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="cmdkInput" placeholder="Befehl oder Ziel eingeben …" autocomplete="off" aria-label="Befehl suchen">
    <kbd>Esc</kbd>
  </div>
  <ul id="cmdkList" role="listbox"></ul>
  <div class="foot"><span>↑ ↓ wählen</span><span>Enter ausführen</span><span>Esc schließen</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
